basics: 基础
data: 数据展示
navigation: 导航
feedback: 反馈
button_intro: 用按钮触发操作。试用不同样式、尺寸、图标与键盘操作。
icon_intro: 沿用应用默认的图标库，也可以为单个图标指定来源。
init_title: 初始化
init_intro: 在打开窗口前，配置应用语言和默认图标库。
init_fonts: 可用 fonts 列表注册嵌入的字体文件。调用 Icon::from_font 时使用字体内部的字族名。
container_intro: 嵌套容器来组织顶栏、侧栏、主内容和底栏。
layout_intro: 用响应式的 24 列栅格组织内容。
link_intro: 用不同语义颜色的文字链接触发操作或打开 URL。
space_intro: 为相邻元素设置间距和对齐方式。
table_intro: 用条纹、边框、固定表头和状态色展示类型化的行列数据。
tag_intro: 用标签标记内容，或用可选择标签切换选中状态。
menu_intro: 试用嵌套菜单、可折叠侧栏和横向菜单。
loading_intro: 在指定区域显示加载提示，不影响窗口内其他区域的操作。
