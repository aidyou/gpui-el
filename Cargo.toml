[package]
name = "gpui-el"
version = "0.1.0"
edition = "2024"
description = "Element Plus style components for native Rust GPUI applications"
documentation = "https://docs.rs/gpui-el"
license = "MIT"
keywords = ["gpui", "element-plus", "gui", "components"]
categories = ["gui"]
include = ["/src/**", "/examples/**", "/i18n/**", "/README.md", "/CONSTITUTION.md", "/COMPONENT_EXCLUSIONS.md", "/LICENSE", "/Cargo.toml", "/build.rs"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui = { package = "gpui-fast", version = "=0.1.19" }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
ttf-parser = "0.25"

[dev-dependencies]
gpui = { package = "gpui-fast", version = "=0.1.19", features = ["test-support"] }
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.19", features = ["x11", "wayland"] }
unicode-segmentation = "1"

[profile.dev.package."*"]
opt-level = 2
