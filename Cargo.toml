[package]
name = "gpui-el"
version = "0.1.0"
edition = "2024"
description = "Element Plus style components for native Rust GPUI applications"
documentation = "https://docs.rs/gpui-el"
license = "MIT"
keywords = ["gpui", "element-plus", "gui", "components"]
categories = ["gui"]
include = ["/src/**", "/examples/**", "/i18n/**", "/CONSTITUTION.md", "/LICENSE", "/Cargo.toml", "/build.rs"]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.14" }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.14", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", features = ["x11", "wayland"] }
unicode-segmentation = "1"
